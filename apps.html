<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技マシン｜全アプリ一覧（実際に触れるデモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--panel:#121a30;--panel-2:#0e1528;--ink:#eef2fb;--ink-2:#aeb8d4;--ink-3:#6b7798;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --gold:#e3b864;--cyan:#4fd1e6;--emerald:#37e29a;--navy-glow:rgba(79,209,230,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 600px at 15% -10%,rgba(79,209,230,.13),transparent 60%),
  radial-gradient(800px 700px at 95% 0%,rgba(227,184,100,.10),transparent 55%),
  radial-gradient(900px 800px at 50% 120%,rgba(55,226,154,.08),transparent 60%),var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding:0 26px}
header{padding:18px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,11,22,.8);backdrop-filter:blur(16px);z-index:50}
.nav{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:11px;font-weight:900;font-size:16px}
.logo .mk{width:36px;height:36px;border-radius:9px;background:conic-gradient(from 210deg,var(--cyan),var(--emerald),var(--gold),var(--cyan));display:grid;place-items:center;color:#04101a;font-family:'Orbitron';font-weight:800;font-size:17px;box-shadow:0 0 20px var(--navy-glow)}
.logo small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--ink-3);font-weight:500}
.nav .home{margin-left:auto;color:var(--ink-2);text-decoration:none;font-size:13px;padding:8px 14px;border:1px solid var(--line-2);border-radius:8px}
.nav .home:hover{color:var(--ink);border-color:var(--cyan)}
.hero{text-align:center;padding:54px 0 30px}
.ey{display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:11.5px;letter-spacing:.1em;color:var(--cyan);font-weight:700;margin-bottom:18px}
.ey .d{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 9px var(--emerald)}
.hero h1{font-size:clamp(26px,4.4vw,42px);font-weight:900;letter-spacing:-.02em;line-height:1.3}
.hero h1 .g{background:linear-gradient(110deg,var(--cyan),var(--emerald) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink-2);font-size:15px;margin-top:14px}
.hero p b{color:var(--ink)}
.stat-row{display:flex;gap:26px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.stat{text-align:center}
.stat .v{font-family:'Orbitron';font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--emerald));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:4px}
.cat{margin:42px 0 0}
.cat-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cat-h .ic{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.cat-h h2{font-size:18px;font-weight:800}
.cat-h .c{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{display:block;text-decoration:none;color:inherit;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}
.card:hover{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.card .top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.card .ic{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.card .score{margin-left:auto;font-family:'Orbitron';font-size:12px;font-weight:800;color:var(--emerald);background:rgba(55,226,154,.1);border:1px solid rgba(55,226,154,.25);padding:3px 9px;border-radius:99px}
.card h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card .desc{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.55;min-height:34px}
.card .go{margin-top:12px;font-size:12.5px;font-weight:800;color:var(--cyan);display:flex;align-items:center;gap:6px;transition:gap .2s}
.card:hover .go{gap:10px}
footer{border-top:1px solid var(--line);margin-top:50px;padding:30px 0;text-align:center;color:var(--ink-3);font-size:12.5px}
footer b{color:var(--ink-2)}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo"><div class="mk">技</div><div>技マシン<small>AI BUSINESS AUTOMATION</small></div></div>
  <a class="home" href="./">← ショールームTOP</a>
</div></header>

<div class="wrap">
  <div class="hero">
    <div class="ey"><span class="d"></span>すべて実際に触って動かせます</div>
    <h1>技マシン <span class="g">全30アプリ</span>、<br>気になる仕事をクリックして体験。</h1>
    <p>各マシンは<b>本物のSaaSのような管理画面</b>です。ダッシュボード・一覧・AI自動処理まで、実際に操作できます。</p>
    <div class="stat-row">
      <div class="stat"><div class="v">30</div><div class="l">業務アプリ</div></div>
      <div class="stat"><div class="v">93<span style="font-size:16px">点</span></div><div class="l">AI品質チェック平均</div></div>
      <div class="stat"><div class="v">100<span style="font-size:16px">%</span></div><div class="l">90点以上クリア</div></div>
    </div>
  </div>
  <div id="cats"></div>
</div>

<footer><div class="wrap"><b>技マシン</b> — AI業務自動化アプリ集 ｜ 株式会社気持ち市場<br>
<span style="opacity:.6">※ 体験用デモです。表示データはサンプルです。AI組織（複数AIエージェント）が各アプリを90点以上まで採点・調整しました。</span></div></footer>

<script>
const CATS=[
  {id:'back',ic:'🗂',name:'バックオフィス'},
  {id:'sales',ic:'📈',name:'営業・販促'},
  {id:'cs',ic:'💬',name:'お客様対応'},
  {id:'ops',ic:'🏭',name:'現場・運用'},
  {id:'care',ic:'🏥',name:'医療・介護'},
];
const APPS=[
  {f:'invoice-app',ic:'🧾',t:'請求マシン',c:'back',s:'—',d:'請求書を入力→即作成、入金管理・AI一括生成'},
  {f:'estimate-app',ic:'📝',t:'見積マシン',c:'back',s:94,d:'案件入力→AIが最適価格を提案・見積生成'},
  {f:'expense-app',ic:'✅',t:'経費承認マシン',c:'back',s:94,d:'領収書を規程と自動照合して承認フロー'},
  {f:'minutes-app',ic:'🎙',t:'議事録マシン',c:'back',s:93,d:'録音→文字起こし→要約→ToDo抽出'},
  {f:'mail-sort-app',ic:'📥',t:'メール仕分けマシン',c:'back',s:94,d:'受信メールをAIが緊急/受注/問合せに自動分類'},
  {f:'receipt-app',ic:'🧮',t:'レシート経費精算',c:'back',s:93,d:'撮るだけで科目自動判定→freee連携'},
  {f:'reconcile-app',ic:'🏦',t:'入金消込マシン',c:'back',s:91,d:'銀行データと請求書をAIが自動マッチング'},
  {f:'closing-app',ic:'📈',t:'月次決算マシン',c:'back',s:93,d:'会計データ→試算表→異常値アラート'},

  {f:'sales-mail-app',ic:'✉️',t:'営業メール作成',c:'sales',s:93,d:'顧客課題に合わせた文面を数秒で生成'},
  {f:'sns-app',ic:'📱',t:'SNS投稿マシン',c:'sales',s:93,d:'1テーマからX/Instagram/LINE用を一括生成'},
  {f:'product-desc-app',ic:'🛍',t:'商品説明文マシン',c:'sales',s:93,d:'特徴から売れる説明文とSEOを生成'},
  {f:'proposal-app',ic:'📊',t:'提案書マシン',c:'sales',s:95,d:'ヒアリングから提案スライドを自動生成'},
  {f:'competitor-app',ic:'🔍',t:'競合分析マシン',c:'sales',s:94,d:'競合を自動収集して比較表化'},
  {f:'scout-app',ic:'🎯',t:'採用スカウトマシン',c:'sales',s:93,d:'条件に合う人材を探してスカウト文生成'},
  {f:'screening-app',ic:'📄',t:'応募選考マシン',c:'sales',s:93,d:'履歴書をAI採点→面接案内を自動送信'},
  {f:'jobpost-app',ic:'📢',t:'求人原稿マシン',c:'sales',s:93,d:'条件から応募が集まる原稿を生成'},

  {f:'phone-app',ic:'📞',t:'電話自動応答マシン',c:'cs',s:92,d:'着信→AI応答→予約登録→SMSまで自動'},
  {f:'claim-app',ic:'🙇',t:'クレーム返信マシン',c:'cs',s:93,d:'感情分析→謝罪文＋解決策3案を提示'},
  {f:'reservation-app',ic:'🗓',t:'予約自動受付マシン',c:'cs',s:92,d:'Web/電話/LINEを24時間自動受付・重複防止'},
  {f:'delivery-track-app',ic:'🚚',t:'配送追跡通知マシン',c:'cs',s:93,d:'配達状況をリアルタイム表示・自動通知'},
  {f:'faq-app',ic:'🤖',t:'FAQチャットボット',c:'cs',s:94,d:'よくある質問に24時間自動回答'},

  {f:'inventory-app',ic:'📦',t:'在庫アラートマシン',c:'ops',s:93,d:'発注点割れを検知→発注書を自動下書き'},
  {f:'shift-app',ic:'📅',t:'シフト最適化マシン',c:'ops',s:94,d:'希望と労務ルールから最適シフトを自動生成'},
  {f:'sales-monitor-app',ic:'📊',t:'売上モニターマシン',c:'ops',s:93,d:'売上をリアルタイム集計・異常を自動検知'},
  {f:'production-app',ic:'🏭',t:'製造日報マシン',c:'ops',s:92,d:'各ライン実績を自動集計・異常原因を提示'},
  {f:'route-app',ic:'🗺',t:'配送ルート最適化',c:'ops',s:92,d:'訪問先からAIが最短ルートを提案'},
  {f:'dispatch-app',ic:'🚛',t:'配車管理マシン',c:'ops',s:93,d:'全車両の位置と進捗を1画面で・最適配車'},

  {f:'vital-app',ic:'❤️',t:'健康モニターマシン',c:'care',s:93,d:'バイタルを常時監視・異常を即通知'},
  {f:'care-record-app',ic:'📋',t:'介護記録マシン',c:'care',s:94,d:'話すだけで介護記録が自動完成・申し送り生成'},
  {f:'contract-app',ic:'⚖️',t:'契約書チェックマシン',c:'care',s:93,d:'リスク条項をAIが抽出・修正案を提示'},
];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('cats').innerHTML=CATS.map(cat=>{
  const list=APPS.filter(a=>a.c===cat.id);
  return `<section class="cat"><div class="cat-h"><div class="ic">${cat.ic}</div><h2>${cat.name}</h2><span class="c">${list.length}アプリ</span></div>
    <div class="grid">${list.map(a=>`
      <a class="card" href="${esc(a.f)}.html">
        <div class="top"><div class="ic">${a.ic}</div>${a.s!=='—'?`<span class="score">${a.s}点</span>`:'<span class="score" style="color:var(--gold);background:rgba(227,184,100,.1);border-color:rgba(227,184,100,.25)">基準</span>'}</div>
        <h3>${esc(a.t)}</h3>
        <div class="desc">${esc(a.d)}</div>
        <div class="go">▶ アプリを開く</div>
      </a>`).join('')}</div></section>`;
}).join('');
</script>
</body>
</html>
