const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur='all';
function renderFilters(){
  const fl=document.getElementById('filters');
  fl.innerHTML='<button data-c="all" class="on">すべて('+APPS.length+')</button>'+
    CATS.map(c=>`<button data-c="${c.id}">${c.ic} ${c.name}(${APPS.filter(a=>a.c===c.id).length})</button>`).join('');
  fl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    cur=b.dataset.c;fl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(cur!=='all'){const el=document.getElementById('cat-'+cur);if(el)el.scrollIntoView({behavior:'smooth'});}
    else window.scrollTo({top:0,behavior:'smooth'});
  });
}
function cardHTML(a,feat){
  return `<a class="card${feat?' feat':''}" href="${esc(a.f)}.html">
    ${feat?'<span class="newbadge">✨ 格上げ版</span>':''}
    <div class="top"><div class="ic">${a.ic}</div>${a.s!=='—'?`<span class="score">${a.s}点</span>`:'<span class="score" style="color:var(--gold);background:rgba(227,184,100,.1);border-color:rgba(227,184,100,.25)">基準</span>'}</div>
    <h3>${esc(a.t)}</h3><div class="desc">${esc(a.d)}</div><div class="go">▶ アプリを開く</div>
  </a>`;
}
const FEATURED=['shift-app','crm-app','multi-sns-app','care-record-app','invoice-app'];
function render(){
  const fc=FEATURED.map(f=>APPS.find(a=>a.f===f)).filter(Boolean);
  const pick=`<section class="cat" id="cat-featured"><div class="cat-h feat-head"><div class="ic">✨</div><h2><span class="g">最新・プロUI格上げ版</span></h2><span class="c">まずはコレ</span></div>
    <div class="feat-lead">🏆 <b>プロが本気で作り直した最新の完成形です。</b>まずはこの5本を触ってみてください。デザイン・使いやすさ・便利機能を最高水準（95〜96点）に磨いています。</div>
    <div class="grid">${fc.map(a=>cardHTML(a,true)).join('')}</div></section>`;
  document.getElementById('cats').innerHTML=pick+CATS.map(cat=>{
    const list=APPS.filter(a=>a.c===cat.id);
    if(!list.length)return '';
    return `<section class="cat" id="cat-${cat.id}"><div class="cat-h"><div class="ic">${cat.ic}</div><h2>${cat.name}</h2><span class="c">${list.length}アプリ</span></div>
      <div class="grid">${list.map(a=>cardHTML(a,false)).join('')}</div></section>`;
  }).join('');
}
renderFilters();render();
